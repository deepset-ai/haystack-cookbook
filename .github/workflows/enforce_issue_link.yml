name: Enforce issue-first contribution

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: write
  issues: read

jobs:
  enforce-issue-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const author = context.payload.pull_request.user.login;

            // Only enforce on open PRs: edits to old closed/merged PRs must not trigger it.
            // (Reopening a PR fires `reopened`, at which point its state is open again.)
            if (context.payload.pull_request.state !== "open") {
              console.log("PR is not open, skipping.");
              return;
            }

            // The check passed: drop the `needs-issue` label if an earlier run added it.
            const clearNeedsIssueLabel = async () => {
              const labels = (context.payload.pull_request.labels || []).map((l) => l.name);
              if (!labels.includes("needs-issue")) return;
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  name: "needs-issue",
                });
              } catch (e) {
                console.log(`Could not remove needs-issue label: ${e.message}`);
              }
            };

            // Maintainers and bots (e.g. Dependabot) don't need an assigned issue.
            const exemptAssociations = ["OWNER", "MEMBER", "COLLABORATOR"];
            if (
              context.payload.pull_request.user.type === "Bot" ||
              exemptAssociations.includes(context.payload.pull_request.author_association)
            ) {
              console.log(`Skipping check for ${author} (${context.payload.pull_request.author_association}).`);
              await clearNeedsIssueLabel();
              return;
            }

            const match = body.match(/\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#(\d+)\b/i);

            const explain = async (message) => {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: message,
              });
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                state: "closed",
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: ["needs-issue"],
              });
            };

            if (!match) {
              await explain(
                `Hi @${author} — new examples must start as an issue before a PR is opened. ` +
                `Please open an issue with the [new example template](../../issues/new?template=new_example.yml), ` +
                `get it assigned to you by a maintainer, then reopen this PR with \`Closes #<issue>\` in the description. ` +
                `See [CONTRIBUTING.md](../../blob/main/CONTRIBUTING.md).`
              );
              return;
            }

            const issueNumber = parseInt(match[3], 10);
            let issue;
            try {
              issue = (await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              })).data;
            } catch (e) {
              await explain(
                `Hi @${author} — issue #${issueNumber} referenced in this PR could not be found. ` +
                `Please link a valid, assigned issue. See [CONTRIBUTING.md](../../blob/main/CONTRIBUTING.md).`
              );
              return;
            }

            const assignees = (issue.assignees || []).map((a) => a.login.toLowerCase());
            if (!assignees.includes(author.toLowerCase())) {
              await explain(
                `Hi @${author} — issue #${issueNumber} isn't assigned to you. ` +
                `A maintainer needs to assign the issue to you before a PR for it is accepted. ` +
                `See [CONTRIBUTING.md](../../blob/main/CONTRIBUTING.md).`
              );
              return;
            }

            await clearNeedsIssueLabel();
